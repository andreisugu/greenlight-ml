<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0b1019" />
      <stop offset="100%" stop-color="#05080d" />
    </linearGradient>
    
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Cinema Gold Glow -->
    <radialGradient id="amberGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Greenlight Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Film Reel Pattern -->
    <pattern id="sprocket" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect x="6" y="2" width="12" height="8" rx="2" fill="#1e293b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect width="900" height="280" rx="16" fill="url(#bg)" />
  
  <!-- Subtle Glows -->
  <rect width="900" height="280" rx="16" fill="url(#emeraldGlow)" />
  <rect width="900" height="280" rx="16" fill="url(#amberGlow)" />

  <!-- Top and Bottom Film Sprocket Borders -->
  <rect x="0" y="0" width="900" height="12" fill="url(#sprocket)" />
  <rect x="0" y="268" width="900" height="12" fill="url(#sprocket)" />
  
  <!-- Ambient Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="12" x2="80" y2="268" />
    <line x1="260" y1="12" x2="260" y2="268" />
    <line x1="640" y1="12" x2="640" y2="268" />
    <line x1="820" y1="12" x2="820" y2="268" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="200" x2="900" y2="200" />
  </g>

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="899" height="279" rx="15.5" fill="none" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- LEFT ICON: Modern Glowing Greenlight Cinema Aperture -->
  <g transform="translate(68, 68)">
    <!-- Outer ambient ring -->
    <circle cx="72" cy="72" r="64" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Rotating cinema shutter blades -->
    <circle cx="72" cy="72" r="52" fill="#042f2e" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.8" stroke-width="2" />
    
    <!-- Shutter / Iris geometry -->
    <path d="M72 20 L96 60 L72 72 Z" fill="#10b981" fill-opacity="0.75" />
    <path d="M124 72 L84 96 L72 72 Z" fill="#059669" fill-opacity="0.85" />
    <path d="M72 124 L48 84 L72 72 Z" fill="#34d399" fill-opacity="0.75" />
    <path d="M20 72 L60 48 L72 72 Z" fill="#047857" fill-opacity="0.85" />

    <!-- Center Glowing Signal Bulb (The Greenlight) -->
    <circle cx="72" cy="72" r="22" fill="#022c22" stroke="#34d399" stroke-width="2.5" />
    <circle cx="72" cy="72" r="14" fill="#10b981" />
    <circle cx="68" cy="68" r="4" fill="#ffffff" fill-opacity="0.8" />
    
    <!-- Small pulse waves -->
    <circle cx="72" cy="72" r="76" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- CENTER CONTENT: Typography -->
  <g transform="translate(250, 80)">
    <!-- Brand Title -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
      GREENLIGHT
    </text>
    
    <!-- 'ML' Badge -->
    <g transform="translate(290, 8)">
      <rect x="0" y="0" width="70" height="42" rx="8" fill="url(#badgeGrad)" />
      <text x="35" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#022c22" text-anchor="middle" letter-spacing="1">
        ML
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#10b981" letter-spacing="3.2">
      THE PRE-RELEASE THEATRICAL RISK ENGINE
    </text>

    <!-- Pitch sentence -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Simulated portfolio ROI optimization, multimodal metadata &amp; NLP leakage auditing.
    </text>

    <!-- Bottom Feature Pills / Badges -->
    <g transform="translate(0, 118)">
      <!-- Pill 1: TMDB 5000 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#38bdf8" />
        <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">
          TMDB 5000 AUDITED
        </text>
      </g>

      <!-- Pill 2: Leakage Isolated -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="148" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#f59e0b" />
        <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">
          LEAKAGE-ISOLATED
        </text>
      </g>

      <!-- Pill 3: Net ROI -->
      <g transform="translate(306, 0)">
        <rect x="0" y="0" width="154" height="26" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#34d399" />
        <text x="22" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#6ee7b7" letter-spacing="0.5">
          PORTFOLIO ROI +181.8%
        </text>
      </g>
    </g>
  </g>
</svg>
