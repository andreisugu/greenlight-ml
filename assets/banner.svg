<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1522" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>
    
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#334155" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>

    <!-- Focal Glows -->
    <radialGradient id="emeraldAura" cx="12%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="titleAura" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Base Card Background -->
  <rect width="920" height="310" rx="16" fill="url(#bg)" />
  <rect width="920" height="310" rx="16" fill="url(#emeraldAura)" />
  <rect width="920" height="310" rx="16" fill="url(#titleAura)" />

  <!-- Subtle Ambient Horizontal Guides -->
  <line x1="32" y1="20" x2="888" y2="20" stroke="#1e293b" stroke-opacity="0.6" stroke-width="1" />
  <line x1="32" y1="290" x2="888" y2="290" stroke="#1e293b" stroke-opacity="0.6" stroke-width="1" />
  
  <!-- Subtle corner tick marks -->
  <path d="M 32 30 L 32 20 L 42 20" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5" fill="none" />
  <path d="M 888 30 L 888 20 L 878 20" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5" fill="none" />
  <path d="M 32 280 L 32 290 L 42 290" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5" fill="none" />
  <path d="M 888 280 L 888 290 L 878 290" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.5" fill="none" />

  <!-- Card Border -->
  <rect x="0.75" y="0.75" width="918.5" height="308.5" rx="15.25" fill="none" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- ========================================== -->
  <!-- LEFT EMBLEM: Minimalist Modern Cinema Iris -->
  <!-- ========================================== -->
  <g transform="translate(108, 155)">
    <!-- Soft background glow disc -->
    <circle cx="0" cy="0" r="54" fill="#042f2e" fill-opacity="0.45" stroke="#065f46" stroke-width="1" />
    
    <!-- Outer Precision Ring -->
    <circle cx="0" cy="0" r="44" fill="#0b1320" stroke="#1e293b" stroke-width="2" />
    
    <!-- Clean Minimalist 3-Blade Aperture -->
    <path d="M 0 -44 A 44 44 0 0 1 38 22 L 8 4 Z" fill="#0d9488" fill-opacity="0.75" />
    <path d="M 38 22 A 44 44 0 0 1 -38 22 L -8 -10 Z" fill="#059669" fill-opacity="0.85" />
    <path d="M -38 22 A 44 44 0 0 1 0 -44 L 14 -4 Z" fill="#10b981" fill-opacity="0.75" />

    <!-- Center Aperture Opening (The Greenlight) -->
    <circle cx="0" cy="0" r="18" fill="#022c22" stroke="#34d399" stroke-width="2" />
    <circle cx="0" cy="0" r="11" fill="#10b981" />
    <circle cx="-3" cy="-3" r="3.5" fill="#ffffff" fill-opacity="0.8" />
  </g>

  <!-- ========================================== -->
  <!-- RIGHT CONTENT: Balanced Visual Hierarchy   -->
  <!-- ========================================== -->
  <g transform="translate(205, 0)">
    
    <!-- 1. Overline / Tagline -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="2.8">
      PRE-RELEASE THEATRICAL RISK ENGINE
    </text>

    <!-- 2. Primary Wordmark & Badge -->
    <g transform="translate(0, 126)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
        GREENLIGHT
      </text>
      
      <!-- ML Pill -->
      <g transform="translate(294, -34)">
        <rect x="0" y="0" width="62" height="38" rx="8" fill="url(#badgeGrad)" />
        <text x="31" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#022c22" text-anchor="middle" letter-spacing="0.5">
          ML
        </text>
      </g>
    </g>

    <!-- 3. High-Contrast, Clean Subtitle -->
    <text x="0" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1" letter-spacing="0.1">
      Capital allocation &amp; simulated portfolio ROI optimization on TMDB 5,000.
    </text>

    <!-- 4. Spacious, Uncrowded Badges (Generous Gaps, Readable Text) -->
    <g transform="translate(0, 204)">
      
      <!-- Chip 1: TMDB 5,000 Dataset -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="144" height="28" rx="6" fill="#131d2e" stroke="#223249" stroke-width="1.2" />
        <circle cx="14" cy="14" r="3.5" fill="#38bdf8" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.4">
          5,000 TMDB TITLES
        </text>
      </g>

      <!-- Chip 2: Leakage Audited -->
      <g transform="translate(158, 0)">
        <rect x="0" y="0" width="144" height="28" rx="6" fill="#131d2e" stroke="#223249" stroke-width="1.2" />
        <circle cx="14" cy="14" r="3.5" fill="#f59e0b" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.4">
          LEAKAGE AUDITED
        </text>
      </g>

      <!-- Chip 3: Contextualized ROI Benchmark -->
      <g transform="translate(316, 0)">
        <rect x="0" y="0" width="224" height="28" rx="6" fill="#042a20" stroke="#059669" stroke-width="1.2" />
        <circle cx="14" cy="14" r="3.5" fill="#34d399" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="0.3">
          BACKTESTED ROI · +181.8%
        </text>
      </g>

    </g>
  </g>
</svg>
